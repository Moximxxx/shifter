# GoReleaser configuration for Shifter
# Build with: goreleaser build --snapshot --clean

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: shifter
    binary: shifter
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - format: tar.gz
    name_template: >-
      shifter_{{ .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip

brews:
  - name: shifter
    repository:
      owner: moximxxx
      name: homebrew-tap
    homepage: "https://github.com/moximxxx/shifter"
    description: "One-click config porting between coding agents"
    license: MIT
    test: |
      system "#{bin}/shifter --help"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch
