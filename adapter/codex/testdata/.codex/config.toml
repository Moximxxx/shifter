model = "gpt-5"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
model_reasoning_effort = "high"
project_doc_max_bytes = 0

[mcp_servers]
  [mcp_servers.context7]
    command = "npx"
    args = ["-y", "@upstash/context7-mcp@latest"]
  [mcp_servers.filesystem]
    command = "npx"
    args = ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
  [mcp_servers.github]
    command = "npx"
    args = ["-y", "@modelcontextprotocol/server-github"]
    [mcp_servers.github.env]
      GITHUB_TOKEN = "${GITHUB_TOKEN}"
  [mcp_servers.postgres]
    command = "npx"
    args = ["-y", "@modelcontextprotocol/server-postgres"]
    [mcp_servers.postgres.env]
      DATABASE_URL = "${DATABASE_URL}"

[agents]
  [agents.architect]
    description = "系统架构设计和技术方案评审"
    system_prompt = "你是系统架构师。负责：\n\n1. 分析需求并设计系统架构\n2. 技术选型和 trade-off 分析\n3. 数据库设计和 API 设计\n4. 安全架构评审\n5. 性能瓶颈分析\n\n始终提供至少 2 个备选方案，并标明推荐方案及理由。"
    tools = ["Read", "Glob", "Grep", "WebSearch"]
  [agents.code-reviewer]
    description = "审查代码质量、安全性和最佳实践"
    system_prompt = "你是一位资深代码审查专家。审查代码时遵循以下清单：\n\n1. 正确性：检查逻辑错误、边界条件、空指针\n2. 安全性：检查 SQL 注入、XSS、CSRF、密钥泄露\n3. 性能：检查 N+1 查询、不必要的循环、内存泄漏\n4. 可维护性：检查命名规范、代码重复、函数长度\n5. 测试覆盖：检查关键路径是否有测试\n\n输出格式：\n- 🔴 Critical: 必须修复的问题\n- 🟡 Medium: 建议修复的问题\n- 🟢 Minor: 可选的改进建议"
    tools = ["Read", "Glob", "Grep"]
    model = "gpt-5"
  [agents.test-writer]
    description = "为代码生成单元测试和集成测试"
    system_prompt = "你是测试专家。为指定代码生成测试：\n\n1. 使用 Arrange-Act-Assert 模式\n2. 覆盖正常路径、边界条件、错误路径\n3. Mock 外部依赖，不 mock 内部逻辑\n4. 测试名称格式：should_<行为>_when_<条件>\n5. 优先使用表驱动测试"
    tools = ["Read", "Write", "Edit", "Glob", "Grep", "Bash"]
    model = "gpt-5"

[hooks]

  [[hooks.PostToolUse]]
    matcher = "Write|Edit"

    [[hooks.PostToolUse.hooks]]
      type = "command"
      command = "bash .codex/hooks/post-edit-verify.sh"

  [[hooks.PreToolUse]]
    matcher = "Bash"

    [[hooks.PreToolUse.hooks]]
      type = "command"
      command = "bash .codex/hooks/destructive-guard.sh"

  [[hooks.PreToolUse]]
    matcher = "Write|Edit"

    [[hooks.PreToolUse.hooks]]
      type = "command"
      command = "bash .codex/hooks/pre-edit-check.sh"

  [[hooks.SessionStart]]
    matcher = "*"

    [[hooks.SessionStart.hooks]]
      type = "command"
      command = "bash .codex/hooks/session-start.sh"
      statusMessage = "加载会话上下文..."

  [[hooks.Stop]]
    matcher = "*"

    [[hooks.Stop.hooks]]
      type = "command"
      command = "bash .codex/hooks/stop-checklist.sh"
